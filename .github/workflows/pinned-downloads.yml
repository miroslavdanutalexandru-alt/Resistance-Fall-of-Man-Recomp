name: pinned-downloads

# Once a week (and by hand): downloads every file pinned in setup.ps1 and tools/shaderscan.version and compares its
# SHA-256 with the pin. Fails the run when a link is gone or a file changed, so it shows up before a player's Setup hits it.
# The pins are read from those two files as text; no repository code is run, no secrets are used, nothing is uploaded.

on:
  schedule:
    - cron: '17 5 * * 1'   # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pins:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download each pin and compare SHA-256
        run: python3 .github/scripts/check_pinned_downloads.py
